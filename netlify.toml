[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The React app calls /api/contact — this transparently forwards those
# requests to the Netlify Function so no frontend code needs to change.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
