<!doctype html>
<!--
  NOTE: production domain is unknown at build time, so the URLs below use
  https://your-domain.com as a documented placeholder. Replace every
  occurrence of your-domain.com with the real deployed domain before going
  live (canonical, og:url, og:image, twitter:image).
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Benabdelkrim Aouab | AI Automation & n8n Developer</title>
    <meta
      name="description"
      content="Benabdelkrim Aouab builds AI agents, n8n workflow automation, and the web & mobile software behind them — helping businesses automate lead qualification, CRM sync, bookings, and customer communication."
    />
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Benabdelkrim Aouab | AI Automation & n8n Developer" />
    <meta
      property="og:description"
      content="AI agents, n8n workflow automation, and web & mobile development for businesses that want to automate lead qualification, CRM sync, bookings, and customer communication."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Benabdelkrim Aouab | AI Automation & n8n Developer" />
    <meta
      name="twitter:description"
      content="AI agents, n8n workflow automation, and web & mobile development for businesses that want to automate lead qualification, CRM sync, bookings, and customer communication."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Benabdelkrim Aouab",
        "url": "https://your-domain.com/",
        "jobTitle": "AI Automation & Web Developer",
        "knowsAbout": ["AI Agents", "n8n", "Workflow Automation", "React", "Node.js"],
        "sameAs": ["https://github.com/benabdelkrimaouab"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
